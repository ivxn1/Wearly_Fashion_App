<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Server Error</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #fafafa 0%, #ffffff 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a1a;
    }

    .error-container {
      max-width: 520px;
      text-align: center;
      padding: 60px 32px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.85),
        inset 0 -1px 0 rgba(0, 0, 0, 0.03);
      position: relative;
      overflow: hidden;
    }

    .error-container::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
      pointer-events: none;
    }

    .error-code {
      font-size: 5rem;
      font-weight: 200;
      letter-spacing: 6px;
      color: #1a1a1a;
      opacity: 0.15;
      line-height: 1;
      margin-bottom: 8px;
    }

    .error-divider {
      width: 60px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent 0%, #1a1a1a 50%, transparent 100%);
      margin: 20px auto;
    }

    .error-title {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .error-message {
      font-size: 0.95rem;
      color: #6a6a6a;
      font-weight: 300;
      letter-spacing: 0.3px;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .error-link {
      display: inline-block;
      padding: 14px 48px;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-decoration: none;
      color: #1a1a1a;
      border: 1.5px solid #1a1a1a;
      border-radius: 2px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .error-link:hover {
      background-color: #1a1a1a;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(26, 26, 26, 0.12);
    }

    @media (max-width: 576px) {
      .error-container {
        margin: 24px;
        padding: 48px 24px;
      }

      .error-code {
        font-size: 3.5rem;
      }

      .error-title {
        font-size: 1.3rem;
      }

      .error-link {
        padding: 12px 36px;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <p class="error-code">500</p>
    <div class="error-divider"></div>
    <h1 class="error-title">Something Went Wrong</h1>
    <p class="error-message">
      We encountered an unexpected error. Our team has been notified and is working on it.
      Please try again in a moment.
    </p>
    <a href="/" class="error-link">Back to Home</a>
  </div>
</body>
</html>
