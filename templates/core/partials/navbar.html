<!-- Navigation Bar -->
{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark">
    <!-- Top Row: Logo + Toggler -->
    <div class="navbar-top-row">
        <!-- Logo Section -->
        <div class="navbar-left">
            <a class="navbar-brand" href="{% url 'core:home' %}">
                <img class="navbar-logo" src="{% static 'images/Logo.webp' %}" alt="Wearly Logo">
            </a>
        </div>

        <!-- Mobile Toggle Button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>

    <!-- Collapse Panel: Centered Navigation Links -->
    <div class="collapse navbar-collapse" id="navbarNav">
        <div class="navbar-container">
            <ul class="navbar-nav navbar-center">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'core:home' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'wardrobe:garment_list' %}">Garments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'wardrobe:brand_list' %}">Brands</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'outfits:outfits_list' %}">Outfits</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'planner:list' %}">Planner</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'core:about' %}">About</a>
                </li>
            </ul>
            <ul class="navbar-nav navbar-right">
                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user-profile' pk=user.profile.pk %}">Profile</a>
                </li>
                <li class="nav-item">
                    <form method="post" action="{% url 'user-logout' %}" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" class="nav-link" style="background: none; border: none; cursor: pointer; padding: 0;">Logout</button>
                    </form>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user-login' %}">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'register' %}">Register</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
